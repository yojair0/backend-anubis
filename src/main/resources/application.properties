# Perfil activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8081}

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/anubis_db}

jwt.secret=${JWT_SECRET:AnubisSecretKeyForAdoptionPlatform2024SuperSecretKeyForJWTHS512AlgorithmRequires512BitsMinimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

cors.allowed-origins=${CORS_ORIGINS:*}

# Configuración de email - Gmail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${GMAIL_USER:tu-email@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de la aplicación
app.name=Anubis Adoption Platform
app.frontend.url=http://localhost:3000
app.upload.dir=uploads

# Logging
logging.level.com.anubis=DEBUG
logging.level.org.springframework.security=DEBUG
