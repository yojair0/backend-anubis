# Test Configuration - Simple and Fast
jwt.secret=TestSecretKeyForJWTHS512AlgorithmRequires512BitsMinimumLengthForSecurityPurposesInTestEnvironment
jwt.expiration=86400000
logging.level.com.anubis=WARN
logging.level.org.mongodb=WARN

# Use embedded MongoDB for fast CI tests
spring.data.mongodb.database=testdb
spring.data.mongodb.auto-index-creation=false
de.flapdoodle.mongodb.embedded.version=4.4.18