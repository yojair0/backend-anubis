# Test Profile Configuration
server.port=8081

# In-memory MongoDB for tests (Embedded MongoDB)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=anubis_test

# JWT Configuration for tests
jwt.secret=TestSecretKeyForJWTHS512AlgorithmRequires512BitsMinimumLengthForSecurityPurposesInTestEnvironment
jwt.expiration=86400000

# CORS Configuration for tests
cors.allowed-origins=http://localhost:3000

# Email Configuration for tests (disabled)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# Logging for tests
logging.level.com.anubis=INFO
logging.level.org.springframework.security=DEBUG