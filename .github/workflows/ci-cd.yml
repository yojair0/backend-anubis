name: CI/CD Pipeline - Backend Anubis

on:
  push:
    branches: [ main, continuacion-backend ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test and Coverage

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Setup Test Environment
      run: |
        echo "Setting up test environment"
        echo "Using test profile for MongoDB"

    - name: Run Tests
      run: mvn clean test -Dspring.profiles.active=test

    - name: Generate Coverage Report
      run: mvn jacoco:report

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-backend-anubis
        fail_ci_if_error: false

    - name: Comment Coverage on PR
      uses: madrapps/jacoco-report@v1.6.1
      if: github.event_name == 'pull_request'
      with:
        paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 55
        min-coverage-changed-files: 50

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: target/site/jacoco/

  build:
    runs-on: ubuntu-latest
    needs: test
    name: Build y Validacion

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build Application
      run: mvn clean compile

    - name: Package Application
      run: mvn package -DskipTests

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-anubis-jar
        path: target/*.jar

  quality-gates:
    runs-on: ubuntu-latest
    needs: test
    name: Quality Gates

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Quality Checks
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        mvn clean test jacoco:report
        echo "## Quality Gate Results 📊" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ **Tests**: $(grep -o 'Tests run: [0-9]*' target/surefire-reports/*.txt | head -1 | cut -d' ' -f3)" >> $GITHUB_STEP_SUMMARY
        echo "- 📈 **Coverage**: $(grep -o '[0-9]*%' target/site/jacoco/index.html | head -1)" >> $GITHUB_STEP_SUMMARY
        echo "- 🏗️ **Build**: Success" >> $GITHUB_STEP_SUMMARY
        echo "- 🎯 **Quality**: Professional Standard" >> $GITHUB_STEP_SUMMARY