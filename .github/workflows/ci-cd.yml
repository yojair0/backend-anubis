name: CI - Backend Tests

on:
  push:
    branches: [ main, continuacion-backend ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Run Tests and Coverage
      run: |
        mvn clean test jacoco:report --batch-mode --quiet
        
    - name: Show Coverage Results
      run: |
        echo "Backend Coverage Analysis"
        
        if [ -f target/site/jacoco/jacoco.xml ]; then
          TOTAL_INSTRUCTIONS=$(grep -o 'type="INSTRUCTION".*missed="[0-9]*".*covered="[0-9]*"' target/site/jacoco/jacoco.xml | head -1 | sed 's/.*missed="\([0-9]*\)".*covered="\([0-9]*\)".*/\1 \2/')
          
          if [ ! -z "$TOTAL_INSTRUCTIONS" ]; then
            MISSED=$(echo $TOTAL_INSTRUCTIONS | cut -d' ' -f1)
            COVERED=$(echo $TOTAL_INSTRUCTIONS | cut -d' ' -f2)
            TOTAL=$((MISSED + COVERED))
            
            if [ $TOTAL -gt 0 ]; then
              PERCENTAGE=$((COVERED * 100 / TOTAL))
              
              echo "Total Instructions: $TOTAL"
              echo "Instructions Covered: $COVERED"
              echo "Coverage Percentage: $PERCENTAGE%"
            else
              echo "No coverage data available"
            fi
          else
            echo "Could not parse coverage data"
          fi
        else
          echo "Coverage report not found"
        fi